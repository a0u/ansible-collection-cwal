---

sudo: {}

sudo_sudoers: '{{ {
    "FreeBSD": "/usr/local/etc/sudoers",
    "Linux": "/etc/sudoers",
  }[ansible_facts["system"]] | mandatory }}'

sudo_includedir: '{{ {
    "FreeBSD": "/usr/local/etc/sudoers.d",
    "Linux": "/etc/sudoers.d",
  }[ansible_facts["system"]] | mandatory }}'

sudo_visudo: '{{ {
    "FreeBSD": "/usr/local/sbin/visudo",
    "Linux": "/usr/sbin/visudo",
  }[ansible_facts["system"]] | mandatory }}'

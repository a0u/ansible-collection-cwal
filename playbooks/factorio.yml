---

- hosts: '{{ target | default("factorio") }}'
  remote_user: 'admin'
  become: true
  become_method: 'sudo'
  gather_facts: true
  tasks:
    - group_by:
        key: '{{ ansible_facts["distribution"] }}'
      tags: 'always'

- hosts: '{{ target | default("factorio") }}'
  remote_user: 'admin'
  become: true
  become_method: 'sudo'
  gather_facts: false
  roles:
    - 'common'
    - 'factorio'
